server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai.jiaolian.help _;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /putty-ai;
    }

    location = /putty-ai/ {
        return 301 /putty-ai;
    }

    location = /putty-ai {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Search engines request robots.txt from the host root. The sitemap itself
    # remains inside the product path advertised in robots.txt.
    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        default_type text/plain;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/html/sitemap.xml;
        default_type application/xml;
    }

    location ^~ /putty-ai/ {
        alias /usr/share/nginx/html/;
        index index.html;
        autoindex off;
    }
}
